spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/chatapp
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:Zm9yLWRldi1vbmx5LWNoYW5nZS10aGlzLXNlY3JldC1rZXktMTIzNDU2Nzg=}
  expiration-ms: 86400000

server:
  port: 8080
